<html>
<head>
    <title>Safa Pharmacy | Place Your Order</title>
    <style>
body {
    font-family: Georgia, serif;
    background-color: #EAD9B0;
    margin: 0;
    padding: 30px;
}

.order-container {
    width: 460px;
    margin: auto;
    background-color: #E8D5A6;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #8B6A3E;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

h2 {
    text-align: center;
    color: #4B2E17;
    letter-spacing: 2px;
}

label {
    margin-top: 15px;
    display: block;
    font-weight: bold;
    color: #4B2E17;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #8B6A3E;
    border-radius: 6px;
    background: #F9F4E3;
}

.btn-order {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #4B2E17;
    color: #F9F4E3;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-order:hover {
    background: #5C3A1F;
}
</style>

</head>
<body>

<div class="order-container">
<div style="text-align:right; margin-bottom:10px;">
    <label>Language:</label>
    <select>
        <option>English</option>
        <option>Hindi</option>
        <option>Tamil</option>
    </select>
</div>

    <h2>PLACE YOUR ORDER</h2>
    
    <form id="orderForm" action="place_order.php" method="POST" onsubmit="return validateForm()">

        <label>Quantity:</label>
        <input type="number" name="quantity" id="qty" min="1" placeholder="1" required>

        <label>Delivery Type:</label>
        <select name="delivery_type" id="deliveryType" onchange="toggleAddress()" required>
            <option value="pickup">Pickup from Store</option>
            <option value="delivery">Home Delivery</option>
        </select>

        <div id="addressSection" style="display:none;">
            <label>Delivery Address:</label>
            <textarea name="delivery_address" id="address" placeholder="Enter your full address"></textarea>
        </div>

        <label>Payment Method:</label>
        <select name="payment_method" id="payment" required>
            <option value="cash">Cash on Delivery</option>
            <option value="card">Credit / Debit Card</option>
        </select>

        <input type="hidden" name="pharmacy_name" value="Safa Pharmacy">

        <button type="submit" class="btn-order">Confirm Order</button>
    </form>
</div>

<script>
// Show/Hide address based on delivery type
function toggleAddress() {
    var type = document.getElementById("deliveryType").value;
    var section = document.getElementById("addressSection");
    section.style.display = (type === "delivery") ? "block" : "none";
}

// Form validation
function validateForm() {
    var med = document.getElementById("medName").value;
    var qty = document.getElementById("qty").value;
    var type = document.getElementById("deliveryType").value;
    var address = document.getElementById("address").value;

    if (med == "" || qty == "" || type == "") {
        alert("Please fill all required fields!");
        return false;
    }

    if (type === "delivery") {
        var addressVal = address.trim();
        if (addressVal.length < 15) {
            alert("Please enter a full and correct address (Min 15 characters).");
            return false;
        }
        if (/(.)\1{4,}/.test(addressVal)) {
            alert("Invalid address format! Please use correct spellings.");
            return false;
        }
        var addressPattern = /^[a-zA-Z0-9\s,.'-]{10,}$/;
        if (!addressPattern.test(addressVal)) {
            alert("Address can only contain letters, numbers, and basic punctuation.");
            return false;
        }
    }

    return true; 
}

// Popup for success & back to login
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.has('success')) {
        const popup = document.createElement('div');
        popup.innerHTML = `
            <div style="
                position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%);
                background: #4CAF50; color: white; padding: 25px 40px; border-radius: 10px;
                text-align: center; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;">
                Order Placed Successfully!<br><br>
                <a href="login.html" style="
                    text-decoration: none; color: #4CAF50; background: white; padding: 8px 20px;
                    border-radius: 5px; font-weight: bold;">Back to Login</a>
            </div>
        `;
        document.body.appendChild(popup);
    }

    if (urlParams.has('error')) {
        alert(decodeURIComponent(urlParams.get('error')));
    }
});
</script>

</body>
</html>
