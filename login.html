<html>
<head>
    <title>MediConnect | Login</title>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* MAIN SPLIT LAYOUT */
        .main {
            display: flex;
            height: 100vh;
        }

        .image-side {
            width: 50%;
            background: #0b1c3d; /* dark blue fallback */
        }

        .image-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        .login-side {
            width: 50%;
            background-color: #E5CEA1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    
        .container {
            width: 400px;
            background: #E5CEA1;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border: 1px solid #4C3220;
        }

        h2 {
            text-align: center;
            color: #4C3220;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #4C3220;
            font-size: 16px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #4C3220;
            border-radius: 5px;
            font-size: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #4C3220;
            color: #E5CEA1;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 17px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #987654;
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links a {
            text-decoration: none;
            color: #1976D2;
            font-size: 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }
.image-side {
    width: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* BACKGROUND IMAGE */
.image-side .bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* MAIN IMAGE (ON TOP) */
.image-side .main-img {
    position: relative;
    max-width: 70%;
    max-height: 70%;
    object-fit: contain;
    z-index: 2;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}


    </style>
</head>

<body>

<div class="main">

    <!-- LEFT: IMAGE -->
    <div class="image-side">
    <img src="bg.png" class="bg-img">
    <img src="img.jpeg" class="main-img">
</div>


    <!-- RIGHT: LOGIN -->
    <div class="login-side">
        <div class="container">
            <h2>Login to MediConnect</h2>

            <form action="login.php" method="POST">
<label>Language:</label>
<select name=language" required>
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="ta">Tamil</option>
</select>
                <label>Email:</label>
                <input type="email" name="email" required>

                <label>Password:</label>
                <input type="password" name="password" required>

                <label>Login as:</label>
                <select name="role" required>
                    <option value="">--Select Role--</option>
                    <option value="patient">Patient</option>
                    <option value="pharmacy">Pharmacy</option>
                    <option value="delivery_agent">Delivery</option>
                </select>

                <button type="submit" class="btn">Login</button>
            </form>

            <div class="links">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
