<html>
<head>
    <title>Safa Pharmacy | Stock Management</title>
   <style>
body {
    font-family: Georgia, serif;
    background-color: #EAD9B0;
    margin: 0;
    padding: 30px;
}

.container {
    width: 90%;
    margin: auto;
    background-color: #E8D5A6;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #8B6A3E;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

h2, h3 {
    color: #4B2E17;
}

h3 {
    border-bottom: 2px solid #8B6A3E;
    padding-bottom: 6px;
}

.stock-form input {
    padding: 10px;
    border: 1px solid #8B6A3E;
    border-radius: 6px;
    background: #F9F4E3;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: #F3E8C8;
}

th {
    background: #4B2E17;
    color: #F9F4E3;
    padding: 12px;
}

td {
    border: 1px solid #8B6A3E;
    padding: 10px;
    text-align: center;
}

.btn-add {
    background: #4B2E17;
    color: #F9F4E3;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    font-weight: bold;
}

.btn-edit {
    background: #5C3A1F;
    color: white;
    border-radius: 5px;
    padding: 6px 10px;
}

.btn-delete {
    background: #8B1E1E;
    color: white;
    border-radius: 5px;
    padding: 6px 10px;
}
</style>

</head>
<body>

<div class="container">
<div style="text-align:right; margin-bottom:10px;">
    <label>Language:</label>
    <select>
        <option>English</option>
        <option>Hindi</option>
        <option>Tamil</option>
    </select>
</div>

    <h2>Safa Pharmacy - Dashboard</h2>

    <h3>Manage Inventory</h3>
    <div class="stock-form">
        <input type="text" id="medName" placeholder="Medicine Name">
        <input type="number" id="medQty" placeholder="Quantity">
        <input type="number" id="medPrice" placeholder="Price (Max 2000)">
        <button class="btn-add" onclick="addStock()">Add to Stock</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Medicine Name</th>
                <th>Quantity</th>
                <th>Price (Rs)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="stockTableBody">
            <tr>
                <td>Panadol</td>
                <td>50</td>
                <td class="price-val">450</td>
                <td>
                    <button class="btn-edit" onclick="editPrice(this)">Edit Price</button>
                    <button class="btn-delete" onclick="deleteRow(this)">Remove</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
function addStock() {
    var name = document.getElementById("medName").value;
    var qty = document.getElementById("medQty").value;
    var price = document.getElementById("medPrice").value;
    var table = document.getElementById("stockTableBody");

    // 1. Empty Field Validation
    if (name.trim() === "" || qty === "" || price === "") {
        alert("Error: All fields (Name, Quantity, Price) are required!");
        return;
    }

    var regex = /^[a-zA-Z\s]+$/;
    if (!regex.test(name)) {
        alert("Incorrect Medicine Name! Numbers and Special Characters are not allowed.");
        return;
    }

    // 3. Price Limit Validation (Max 2000)
    if (parseInt(price) > 2000) {
        alert("Validation Error: Price cannot be more than 2,000 Rs.");
        return;
    }

    if (parseInt(qty) <= 0) {
        alert("Quantity must be at least 1.");
        return;
    }

    // Add to Table Logic
    var row = table.insertRow();
    row.innerHTML = `
        <td>${name}</td>
        <td>${qty}</td>
        <td class="price-val">${price}</td>
        <td>
            <button class="btn-edit" onclick="editPrice(this)">Edit Price</button>
            <button class="btn-delete" onclick="deleteRow(this)">Remove</button>
        </td>
    `;

   
    document.getElementById("medName").value = "";
    document.getElementById("medQty").value = "";
    document.getElementById("medPrice").value = "";
}

// 
function editPrice(btn) {
    var row = btn.parentNode.parentNode;
    var priceCell = row.querySelector(".price-val");
    var oldPrice = priceCell.innerText;
    
    var newPrice = prompt("Update price for this medicine:", oldPrice);
    
    if (newPrice !== null && newPrice !== "") {
        if (parseInt(newPrice) > 2000) {
            alert("Error: Price limit is 2,000 Rs.");
        } else if (isNaN(newPrice) || parseInt(newPrice) <= 0) {
            alert("Please enter a valid numeric price.");
        } else {
            priceCell.innerText = newPrice;
        }
    }
}


function deleteRow(btn) {
    if (confirm("Are you sure you want to delete this item from stock?")) {
        var row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
    }
}
</script>

</body>
</html>
